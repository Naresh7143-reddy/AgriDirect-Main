          python .github/scripts/generate_all_test_excels.py

      - name: Upload UI/UX Testing Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui_ux_test_cases
          path: test-cases-excel/test-cases-excel/ui_ux_test_cases.xlsx
          retention-days: 30

